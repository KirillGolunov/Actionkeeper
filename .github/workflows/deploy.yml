name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build metadata
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=$OWNER_LC" >> $GITHUB_ENV
          echo "IMAGE_BACKEND=ghcr.io/$OWNER_LC/actionkeeper-backend" >> $GITHUB_ENV
          echo "IMAGE_FRONTEND=ghcr.io/$OWNER_LC/actionkeeper-frontend" >> $GITHUB_ENV

      - name: Build backend image
        run: |
          docker build \
            -f Dockerfile \
            -t $IMAGE_BACKEND:${SHORT_SHA} \
            -t $IMAGE_BACKEND:latest \
            .

      - name: Build frontend image
        run: |
          docker build \
            -f client/Dockerfile \
            -t $IMAGE_FRONTEND:${SHORT_SHA} \
            -t $IMAGE_FRONTEND:latest \
            client

      - name: Push images
        run: |
          docker push $IMAGE_BACKEND:${SHORT_SHA}
          docker push $IMAGE_BACKEND:latest
          docker push $IMAGE_FRONTEND:${SHORT_SHA}
          docker push $IMAGE_FRONTEND:latest

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            retry() {
              attempts="$1"
              delay="$2"
              shift 2
              count=1
              until "$@"; do
                if [ "$count" -ge "$attempts" ]; then
                  echo "Command failed after $count attempts: $*" >&2
                  return 1
                fi
                echo "Command failed, retrying in ${delay}s ($count/$attempts): $*" >&2
                sleep "$delay"
                count=$((count + 1))
              done
            }

            GHCR_TOKEN='${{ secrets.GHCR_TOKEN }}'
            GHCR_OWNER='${{ github.repository_owner }}'
            export GHCR_TOKEN GHCR_OWNER
            retry 5 15 sh -c 'printf "%s\n" "$GHCR_TOKEN" | docker login ${{ env.REGISTRY }} -u "$GHCR_OWNER" --password-stdin'
            unset GHCR_TOKEN
            cd /root/TimeTracker

            backup_dir=$(mktemp -d)
            if [ -f .env ]; then cp .env "$backup_dir/.env"; fi

            retry 5 10 git fetch origin
            git reset --hard origin/main

            if [ -f "$backup_dir/.env" ]; then cp "$backup_dir/.env" .env; fi
            rm -rf "$backup_dir"

            retry 5 20 docker compose pull
            docker compose up -d --remove-orphans
            timeout 120 docker image prune -f || echo "docker image prune skipped or timed out"
